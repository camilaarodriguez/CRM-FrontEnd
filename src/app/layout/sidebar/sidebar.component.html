<aside class="sidebar bg-white shadow-2 h-100 py-4">
  <p class="text-uppercase text-muted small fw-bold px-4 mb-3">Menu</p>

  <div class="list-group list-group-flush">
    <a
      class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-4 py-3"
      routerLink="/clientes"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span><i class="fas fa-users me-2"></i>Clientes</span>
      <span class="badge bg-primary rounded-pill">{{ clientes().length }}</span>
    </a>

    <a
      class="list-group-item list-group-item-action border-0 px-4 py-3"
      routerLink="/clientes/novo"
      routerLinkActive="active"
    >
      <span><i class="fas fa-user-plus me-2"></i>Novo cliente</span>
    </a>
  </div>
</aside>
