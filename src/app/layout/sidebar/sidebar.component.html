<aside class="sidebar bg-white shadow-2 h-100 py-4">
  <p class="text-uppercase text-muted small fw-bold px-4 mb-3">Menu</p>

  <div class="list-group list-group-flush">
    @for (item of itensVisiveis(); track item.rota) {
      <a
        class="list-group-item list-group-item-action border-0 px-4 py-3"
        [routerLink]="item.rota"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exato }"
      >
        <i class="{{ item.icone }} me-2"></i>{{ item.rotulo }}
      </a>
    }
  </div>
</aside>
